name: CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }} / Devise ${{ matrix.devise }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: "3.4.10"
            rails: "8.0.5.1"
            devise: "4.9.4"
          - ruby: "3.4.10"
            rails: "8.0.5.1"
            devise: "5.0.4"
          - ruby: "3.4.10"
            rails: "8.1.3.1"
            devise: "4.9.4"
          - ruby: "3.4.10"
            rails: "8.1.3.1"
            devise: "5.0.4"

    env:
      RAILS_VERSION: ${{ matrix.rails }}
      DEVISE_VERSION: ${{ matrix.devise }}
      ROTP_VERSION: "6.2.0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Set up test database
        run: bundle exec rake app:db:setup

      - name: Run specs
        run: bundle exec rake spec
